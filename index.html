<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ArtBot Opportunity Queue</title>
<style>
:root{--bg:#f4f2ec;--paper:#fffdf8;--ink:#18201d;--muted:#65706a;--line:#d8d7cf;--accent:#176b52;--accent2:#0e4c3a;--new:#225bb7;--act:#177245;--watch:#9a6500;--discard:#737773;--danger:#a23b31;--radius:10px;--shadow:0 10px 30px rgba(31,42,37,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif;font-size:15px}.shell{max-width:1440px;margin:auto;padding:28px 30px 60px}header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line);padding-bottom:20px}.eyebrow{font:700 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}h1{font-family:Iowan Old Style,Palatino,Georgia,serif;font-size:clamp(30px,4vw,48px);line-height:1;margin:7px 0 4px;letter-spacing:-.025em}.sub{color:var(--muted);max-width:720px}.freshness{text-align:right;color:var(--muted);font-size:12px}.freshness strong{display:block;color:var(--ink);font-size:13px}.summary{display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));border-bottom:1px solid var(--line)}.metric{padding:18px 18px 16px;border-right:1px solid var(--line)}.metric:first-child{padding-left:0}.metric:last-child{border:0}.metric b{display:block;font:600 27px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.metric span{font-size:12px;color:var(--muted)}.toolbar{display:grid;grid-template-columns:minmax(240px,1fr) repeat(3,180px) auto;gap:10px;padding:18px 0}.toolbar input,.toolbar select{width:100%;height:44px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);padding:0 12px;font:inherit}.toolbar input:focus,.toolbar select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid rgba(23,107,82,.22);outline-offset:1px}.check{display:flex;align-items:center;gap:7px;white-space:nowrap;color:var(--muted);font-size:13px;padding:0 5px}.check input{width:17px;height:17px}.queue{border-top:1px solid var(--line)}.lead{display:grid;grid-template-columns:150px minmax(300px,1.15fr) minmax(320px,1.45fr) 230px;gap:22px;padding:23px 0;border-bottom:1px solid var(--line);align-items:start}.meta{display:flex;flex-direction:column;gap:8px}.tag{width:max-content;max-width:100%;padding:4px 7px;border:1px solid var(--line);border-radius:4px;font:700 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em;background:var(--paper)}.tag.quick{color:#72540d}.tag.strategic{color:#62519b}.verify{font-size:12px;color:var(--muted)}.verify.bad{color:var(--danger);font-weight:700}.posted{font-size:12px;color:var(--muted)}.titleblock h2{font-family:Iowan Old Style,Palatino,Georgia,serif;font-size:24px;line-height:1.1;margin:0 0 5px;letter-spacing:-.015em}.org{font-weight:650;color:var(--accent2);margin-bottom:12px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:12px}.fact span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}.details p{margin:0 0 11px;line-height:1.5}.label{font:700 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block;margin-bottom:3px}.caveat{color:#754b1b}.next{font-weight:650}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions button,.source-link,.save-note{min-height:40px;border:1px solid var(--line);background:var(--paper);border-radius:6px;font:700 12px/1 inherit;cursor:pointer;color:var(--ink)}.actions button:hover,.save-note:hover{border-color:var(--accent);color:var(--accent)}.actions button.active{background:var(--accent);border-color:var(--accent);color:white}.actions button[data-status="Discard"].active{background:var(--discard);border-color:var(--discard)}.source-link{grid-column:1/-1;display:flex;align-items:center;justify-content:center;text-decoration:none;background:var(--ink);border-color:var(--ink);color:white}.source-link:hover{background:var(--accent2)}details{grid-column:1/-1;margin-top:2px}summary{cursor:pointer;color:var(--muted);font-size:12px;padding:4px 0}textarea{width:100%;min-height:78px;resize:vertical;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:9px;font:13px/1.45 inherit}.save-note{float:right;margin-top:6px;padding:0 12px}.empty{padding:70px 0;text-align:center;color:var(--muted)}.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:white;padding:11px 15px;border-radius:7px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:none}@media(max-width:1050px){.toolbar{grid-template-columns:1fr 1fr 1fr}.toolbar input{grid-column:1/-1}.lead{grid-template-columns:120px 1fr 1.25fr}.actions{grid-column:2/-1;grid-template-columns:repeat(5,1fr)}.source-link{grid-column:auto}}@media(max-width:720px){.shell{padding:20px 17px 50px}header{align-items:flex-start;flex-direction:column}.freshness{text-align:left}.summary{grid-template-columns:repeat(2,1fr)}.metric{border-bottom:1px solid var(--line)}.toolbar{grid-template-columns:1fr}.toolbar input{grid-column:auto}.lead{grid-template-columns:1fr;gap:13px}.actions,details{grid-column:auto}.actions{grid-template-columns:1fr 1fr}.source-link{grid-column:1/-1}.facts{grid-template-columns:1fr}.meta{flex-direction:row;flex-wrap:wrap;align-items:center}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="shell">
<header><div><div class="eyebrow">ArtBot · Emma Anderson opportunity queue</div><h1>Open doors worth pursuing.</h1><div class="sub">Grants, commissions, exhibitions, residencies, public-art calls, and sales opportunities for Emma Anderson Altafulla. Review each lead once: act, watch, or discard.</div></div><div class="freshness"><span>DATA LAST UPDATED</span><strong id="updated">Loading…</strong><span id="pollState">Refreshes every 60 seconds</span></div></header>
<section class="summary" id="summary"></section>
<section class="toolbar" aria-label="Queue filters"><input id="search" type="search" placeholder="Search opportunity, organizer, fit, or source…"><select id="status"><option value="">All statuses</option><option>New</option><option>Act</option><option>Watch</option><option>Discard</option></select><select id="track"><option value="">Both tracks</option><option>Funding</option><option>Exposure + Sales</option></select><select id="type"><option value="">All opportunity types</option></select><label class="check"><input id="hideDiscarded" type="checkbox" checked> Hide discarded</label></section>
<section class="queue" id="queue" aria-live="polite"></section>
</main><div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);let state={opportunities:[],updated_at:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(v){if(!v)return'Unknown';const d=new Date(v);return Number.isNaN(d.valueOf())?v:d.toLocaleString([], {dateStyle:'medium',timeStyle:'short'});}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1800)}
function filtered(){const q=$('#search').value.trim().toLowerCase(),status=$('#status').value,track=$('#track').value,type=$('#type').value,hide=$('#hideDiscarded').checked;return state.opportunities.filter(x=>{if(hide&&x.status==='Discard')return false;if(status&&x.status!==status)return false;if(track&&x.track!==track)return false;if(type&&x.type!==type)return false;if(q&&!JSON.stringify(x).toLowerCase().includes(q))return false;return true}).sort((a,b)=>{const rank={New:0,Act:1,Watch:2,Discard:3};return (rank[a.status]-rank[b.status])||String(b.discovered_at).localeCompare(String(a.discovered_at))})}
function renderSummary(){const counts={New:0,Act:0,Watch:0,Discard:0};state.opportunities.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);$('#summary').innerHTML=`<div class="metric"><b>${state.opportunities.length}</b><span>Total leads</span></div>${['New','Act','Watch','Discard'].map(k=>`<div class="metric"><b>${counts[k]||0}</b><span>${k}</span></div>`).join('')}`}
function renderTypes(){const old=$('#type').value;const types=[...new Set(state.opportunities.map(x=>x.type))].sort();$('#type').innerHTML='<option value="">All opportunity types</option>'+types.map(x=>`<option>${esc(x)}</option>`).join('');$('#type').value=old}
function render(){renderSummary();const rows=filtered();$('#queue').innerHTML=rows.length?rows.map(x=>`<article class="lead" data-id="${esc(x.id)}"><div class="meta"><span class="tag ${x.track==='Funding'?'quick':'strategic'}">${esc(x.track)}</span><span class="tag">${esc(x.type)}</span><span class="verify ${x.verification?.includes('Needs')?'bad':''}">${esc(x.verification)}</span><span class="posted">Found ${fmtDate(x.discovered_at)}</span></div><div class="titleblock"><h2>${esc(x.title)}</h2><div class="org">${esc(x.organization)}</div><div class="facts"><div class="fact"><span>Money / sales</span>${esc(x.compensation)}</div><div class="fact"><span>Location</span>${esc(x.location)}</div><div class="fact"><span>Posted</span>${esc(x.posted)}</div><div class="fact"><span>Deadline</span>${esc(x.deadline)}</div></div></div><div class="details"><p><span class="label">Why it fits Emma</span>${esc(x.fit)}</p><p class="caveat"><span class="label">Reality check</span>${esc(x.caveat)}</p><p class="next"><span class="label">Next step</span>${esc(x.next_step)}</p></div><div class="actions">${['New','Act','Watch','Discard'].map(s=>`<button class="${x.status===s?'active':''}" data-status="${s}">${s}</button>`).join('')}<a class="source-link" href="${esc(x.url)}" target="_blank" rel="noopener">Open official source ↗</a><details><summary>Private notes</summary><textarea aria-label="Notes for ${esc(x.title)}">${esc(x.notes)}</textarea><button class="save-note">Save note</button></details></div></article>`).join(''):'<div class="empty">No opportunities match these filters.</div>'}
const hosted=!['127.0.0.1','localhost'].includes(location.hostname);
const localKey='artscoutbot-decisions-v1';
function savedDecisions(){try{return JSON.parse(localStorage.getItem(localKey)||'{}')}catch{return {}}}
function applySaved(items){const saved=savedDecisions();return items.map(x=>({...x,...(saved[x.id]||{})}))}
async function load(silent=false){try{const url=hosted?'./opportunities.json':'/api/opportunities';const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('Load failed');const fresh=await r.json();const prior=new Set(state.opportunities.map(x=>x.id));state={...fresh,opportunities:hosted?applySaved(fresh.opportunities):fresh.opportunities};$('#updated').textContent=fmtDate(state.updated_at);$('#pollState').textContent=hosted?'Choices and private notes stay in this browser':'Refreshes every 60 seconds';renderTypes();render();if(!silent)return;const added=state.opportunities.filter(x=>!prior.has(x.id)).length;if(added)toast(`${added} new opportunit${added===1?'y':'ies'} added`)}catch(e){$('#pollState').textContent='Dashboard unavailable';if(!silent)$('#queue').innerHTML='<div class="empty">Could not load the opportunity store.</div>'}}
async function update(id,payload){const i=state.opportunities.findIndex(x=>x.id===id);if(hosted){state.opportunities[i]={...state.opportunities[i],...payload};const saved=savedDecisions();saved[id]={status:state.opportunities[i].status,notes:state.opportunities[i].notes||''};localStorage.setItem(localKey,JSON.stringify(saved));render();toast(payload.status?`Moved to ${payload.status}`:'Private note saved in this browser');return}const r=await fetch('/api/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,...payload})});if(!r.ok)throw Error('Save failed');const out=await r.json();state.opportunities[i]=out.opportunity;render();toast(payload.status?`Moved to ${payload.status}`:'Note saved')}
$('#queue').addEventListener('click',e=>{const card=e.target.closest('.lead');if(!card)return;if(e.target.matches('[data-status]'))update(card.dataset.id,{status:e.target.dataset.status}).catch(()=>toast('Could not save'));if(e.target.matches('.save-note'))update(card.dataset.id,{notes:card.querySelector('textarea').value}).catch(()=>toast('Could not save'))});
['search','status','track','type','hideDiscarded'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));load();setInterval(()=>load(true),60000);
</script>
</body></html>
